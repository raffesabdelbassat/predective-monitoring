services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: monitor-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: monitor_user
      POSTGRES_PASSWORD: monitor_pass
      POSTGRES_DB: monitor_db
    ports:
      - "5433:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: monitor-backend
    restart: unless-stopped
    depends_on:
      - timescaledb
    environment:
      DATABASE_URL: postgresql://monitor_user:monitor_pass@timescaledb:5432/monitor_db
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: monitor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"

volumes:
  timescale_data: