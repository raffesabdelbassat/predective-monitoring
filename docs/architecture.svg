<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="410" viewBox="0 0 1100 410" role="img" aria-labelledby="title description">
  <title id="title">Predictive Monitoring architecture</title>
  <desc id="description">A collector sends resource metrics to the FastAPI backend. The backend stores data in TimescaleDB and serves the React dashboard over HTTP and WebSocket.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0 10 5 0 10Z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#334155" flood-opacity=".12"/>
    </filter>
  </defs>
  <rect width="1100" height="410" rx="24" fill="url(#bg)"/>
  <text x="50" y="52" font-family="Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#0f172a">How the platform works</text>
  <text x="50" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="14" fill="#64748b">Collection · storage · prediction · visualization</text>

  <g filter="url(#shadow)">
    <rect x="45" y="132" width="220" height="190" rx="18" fill="url(#card)" stroke="#cbd5e1"/>
    <rect x="300" y="132" width="260" height="190" rx="18" fill="url(#card)" stroke="#a5b4fc"/>
    <rect x="800" y="132" width="255" height="190" rx="18" fill="url(#card)" stroke="#86efac"/>
  </g>

  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <circle cx="155" cy="177" r="24" fill="#e0e7ff"/>
    <text x="155" y="184" font-size="22" fill="#4f46e5">▣</text>
    <text x="155" y="222" font-size="17" font-weight="700" fill="#0f172a">Machine collector</text>
    <text x="155" y="248" font-size="13" fill="#475569">CPU · memory · disk</text>
    <text x="155" y="269" font-size="13" fill="#475569">network · top processes</text>
    <text x="155" y="298" font-size="12" fill="#64748b">Samples every 10 seconds</text>

    <circle cx="430" cy="177" r="24" fill="#e0e7ff"/>
    <text x="430" y="185" font-size="18" font-weight="700" fill="#4f46e5">API</text>
    <text x="430" y="222" font-size="17" font-weight="700" fill="#0f172a">FastAPI backend</text>
    <text x="430" y="248" font-size="13" fill="#475569">Validates and stores readings</text>
    <text x="430" y="269" font-size="13" fill="#475569">Forecasts · anomalies · alerts</text>
    <text x="430" y="298" font-size="12" fill="#64748b">HTTP API + WebSocket stream</text>

    <circle cx="927" cy="177" r="24" fill="#dcfce7"/>
    <text x="927" y="185" font-size="20" fill="#15803d">▤</text>
    <text x="927" y="222" font-size="17" font-weight="700" fill="#0f172a">React dashboard</text>
    <text x="927" y="248" font-size="13" fill="#475569">Live health and metric charts</text>
    <text x="927" y="269" font-size="13" fill="#475569">Alerts · forecasts · thresholds</text>
    <text x="927" y="298" font-size="12" fill="#64748b">Browser interface</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="590" y="235" width="165" height="87" rx="15" fill="url(#card)" stroke="#cbd5e1"/>
  </g>
  <g font-family="Segoe UI,Arial,sans-serif" text-anchor="middle">
    <text x="672" y="267" font-size="15" font-weight="700" fill="#0f172a">TimescaleDB</text>
    <text x="672" y="290" font-size="12" fill="#475569">Metrics · alerts · processes</text>
    <text x="672" y="308" font-size="11" fill="#64748b">PostgreSQL compatible</text>
  </g>

  <path d="M265 225H292" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="278" y="211" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">metrics</text>
  <path d="M560 270H582" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="570" y="256" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">read/write</text>
  <path d="M755 270H792" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="773" y="256" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">query</text>
  <path d="M800 176H575Q560 176 560 191V204" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="674" y="166" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#64748b">HTTP + WebSocket</text>

  <text x="50" y="375" font-family="Segoe UI,Arial,sans-serif" font-size="12" fill="#64748b">Local development: Docker Compose starts the API, database, and dashboard.</text>
</svg>
